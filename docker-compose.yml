services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ./backend
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      AI_PROVIDER: ${AI_PROVIDER:-hybrid}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      SCRAPPIFY_API_KEY: ${SCRAPPIFY_API_KEY}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_SOURCE_HOSTS: ${ALLOWED_SOURCE_HOSTS}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}
    ports:
      - "8000:8000"
    volumes:
      - scrappify_media:/app/media
      - rembg_models:/root/.u2net
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: python -m app.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.6-27b}
      AI_PROVIDER: ${AI_PROVIDER:-hybrid}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      ALLOWED_SOURCE_HOSTS: ${ALLOWED_SOURCE_HOSTS}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN}
      WORKER_ID: ${WORKER_ID:-scrappify-worker}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
  scrappify_media:
  rembg_models:
